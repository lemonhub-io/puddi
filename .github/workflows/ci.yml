name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build
        run: cargo build --release --locked

      - name: Regression tests
        run: cargo test --release --locked -- --skip conformance_suite

      - name: Conformance suite
        shell: bash
        run: node conformance/run.mjs --pud target/release/pud --strict-coverage --json conformance-report.json

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.os }}
          path: conformance-report.json
          if-no-files-found: ignore

  no-runtime:
    name: build without the embedded runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --no-default-features --all-targets

  install-scripts:
    name: install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh -n install.sh
      - name: shellcheck
        run: shellcheck -s sh install.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
